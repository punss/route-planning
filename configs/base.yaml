# Defaults shared by all random instances. Size presets (small/medium/large)
# override only what changes. Values and their confidence: DESIGN_NOTES.md §6.

mode: random
seed: 0
isotopes_file: isotopes.yaml
isotopes: [Y-90, Pb-212, At-211]

geography:
  center: [42.3601, -71.0589]   # downtown Boston
  depot: [42.53, -71.20]        # Route 128 corridor near Burlington (plausible, not a real site)
  circuity: 1.3                 # road km per straight-line km
  speed_kmh: 40
  academic_radius_sd_km: 3.0    # academic centres cluster near the core
  community_ring_km: [5, 40]    # community hospitals: area-uniform in this ring
  coast_mask: true              # reject points in Massachusetts Bay

network:
  n_academic: 2
  n_community: 4
  service_min: 15               # receipt survey + paperwork per stop
  receiving_open: "06:00"       # hot-lab opening time
  # "Future adoption" scenario (assumption A16): alpha therapies (Pb-212, At-211)
  # are treated as routine. Today they are largely in trials, and realistic
  # volumes would leave ~1 At-211 patient per instance, which makes the most
  # decay-sensitive isotope trivial to route.
  eligibility_prob:
    academic:  {Y-90: 0.9, Pb-212: 0.8, At-211: 0.6}
    community: {Y-90: 0.5, Pb-212: 0.3, At-211: 0.15}
  patients_mean:                # Poisson mean per eligible (hospital, isotope) per day
    academic:  {Y-90: 2.0, Pb-212: 2.0, At-211: 1.5}
    community: {Y-90: 0.8, Pb-212: 0.8, At-211: 0.6}
  min_patients_per_isotope: 2   # guarantees every isotope appears in the instance
  demand_scale: 1.0             # multiplies all patients_mean: vary demand independently of hospital count

patients:
  weight_kg: {mean: 80, sd: 15, min: 45, max: 140}
  treatment_window: ["08:00", "15:00"]
  treatment_grid_min: 30

operations:
  lead_time_min: 120            # D11: vial on site >= 2 h before treatment
  qc_min: 60                    # QC release + packaging between batch finish and departure
  production_window: ["03:00", "12:00"]
  batch_slot_min: 30            # discretization of batch finish times (DESIGN_NOTES §5.3)
  dose_tolerance: 0.20          # D4: NRC 10 CFR 35.63
  capacity_factor: 1.5          # Phase 7 only (D24): C_i = kappa * LB_i (DESIGN_NOTES §10); unused by Phases 2-6
  fleet_size: null              # D19: max trips on the road at once; null = no cap
  dispatch_per_slot: 2          # D20: trucks loaded/released per slot, shared across isotopes (L confidence)
  turnaround_min: 30            # D21: depot turnaround between trips
